
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "movie-recommendation-system"
version = "0.1.0"
description = "An end-to-end content-based movie recommendation system."
requires-python = ">=3.10"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"


[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["notebooks"]


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
